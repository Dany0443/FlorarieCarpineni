<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Admin Login - Luci Boutique</title>
<link rel="icon" type="image/png" href="/assets/favicon.svg">
<script src="/js/telemetry.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Baskervville:ital@0;1&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/login.css">
</head>
<body>
  <div class="login-card">
    <div class="login-brand">Luci Boutique.</div>
    <div class="login-sub">Admin</div>
    <form id="login-form" method="post" action="#" autocomplete="on">
      <div id="pw-field">
        <div class="fg"><input type="text" id="u" name="username" placeholder="Utilizator" autocomplete="username" required></div>
        <div class="fg"><input type="password" id="p" name="password" placeholder="Parola" autocomplete="current-password" required></div>
        <div class="fg" style="margin-top:8px;">
          <label class="remember-label" for="remember-me-check">
            <input type="checkbox" id="remember-me-check">
            <span class="remember-box"></span>
            <span class="remember-text">Tine-ma minte</span>
          </label>
        </div>
        <button class="login-btn" id="login-btn" type="submit">Intra</button>
      </div>
    </form>
    <div class="login-divider" id="login-divider" style="display:none;">sau</div>
    <button class="passkey-btn" id="passkey-btn" type="button">Intra cu Passkey</button>
    <div id="passkey-hint" style="display:none;margin-top:8px;font-size:.76rem;color:var(--sub);">Passkey devine disponibil dupa ce este inregistrat din Setari.</div>
    <div class="login-error" id="login-err"></div>
  </div>
<script src="/js/login.js"></script>
</body>
</html>
